name: CMake Multi-Platform Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            platform: windows-msvc
            lib_name: HyperDB.lib
            python_lib_name: HyperDB.pyd
            test_exe: HyperDB-Test.exe
            
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            platform: linux-gcc
            lib_name: libHyperDB.a
            python_lib_name: HyperDB.so
            test_exe: HyperDB-Test
            
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            platform: linux-clang
            lib_name: libHyperDB.a
            python_lib_name: HyperDB.so
            test_exe: HyperDB-Test

          # Native Linux ARM64 (aarch64) on GitHub's free arm64 hosted runner.
          # Produces an aarch64 libHyperDB.a so downstreams (e.g. HyperAuth) can
          # build a linux-arm64 server. All sources are portable; the generic
          # matrix steps + the Ubuntu python3-dev install work unchanged here.
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++
            platform: linux-gcc-arm64
            lib_name: libHyperDB.a
            python_lib_name: HyperDB.so
            test_exe: HyperDB-Test

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python (Windows)
      if: runner.os == 'Windows'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev python3-pip
        pip3 install pybind11 || true

    - name: Build Base Library
      shell: bash
      run: |
        cmake -B build-base \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -S "${{ github.workspace }}"
        cmake --build build-base --config Release --target HyperDB --parallel

    - name: Copy Library to Test Dir
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/HyperDB-Test/include/lib"
        find "${{ github.workspace }}/build-base" -name "${{ matrix.lib_name }}" -exec cp {} "${{ github.workspace }}/HyperDB-Test/include/lib/" \;
        ls -la "${{ github.workspace }}/HyperDB-Test/include/lib/"

    # the test project keeps its own copy of HyperDB.h next to main.cpp. if it
    # drifts from HyperDB/HyperDB.h, the test exe and the lib disagree on the
    # class layout and you get fun linker errors like LNK2005 on the cluster
    # destructor (msvc /LTCG sees the implicit dtor in main.obj AND the
    # explicit dtor from the lib and refuses to dedupe). copy it fresh so
    # there's exactly one source of truth.
    - name: Sync HyperDB.h into Test Tree
      shell: bash
      run: |
        cp "${{ github.workspace }}/HyperDB/HyperDB.h" "${{ github.workspace }}/HyperDB-Test/HyperDB-Test/include/HyperDB.h"
        cp "${{ github.workspace }}/HyperDB/include/hyperdb_generated.h" "${{ github.workspace }}/HyperDB-Test/HyperDB-Test/include/hyperdb_generated.h" 2>/dev/null || true
        rm -rf "${{ github.workspace }}/HyperDB-Test/HyperDB-Test/include/flatbuffers"
        cp -R "${{ github.workspace }}/HyperDB/include/flatbuffers" "${{ github.workspace }}/HyperDB-Test/HyperDB-Test/include/flatbuffers" 2>/dev/null || true

    - name: Build Test Executable
      shell: bash
      run: |
        cmake -B build-test \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=Release \
          -S "${{ github.workspace }}/HyperDB-Test"
        cmake --build build-test --config Release --parallel

    - name: Build Python Library
      shell: bash
      run: |
        cmake -B build-pylib \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DBUILD_PYTHON_MODULE=ON \
          -S "${{ github.workspace }}"
        cmake --build build-pylib --config Release --target HyperDB --parallel

    - name: Copy Library to Python Dir
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/HyperDB-Python/include/lib"
        find "${{ github.workspace }}/build-pylib" -name "${{ matrix.lib_name }}" -exec cp {} "${{ github.workspace }}/HyperDB-Python/include/lib/" \;
        ls -la "${{ github.workspace }}/HyperDB-Python/include/lib/"

    # same story as the test tree — the python bindings include their own copy
    # of HyperDB.h. keep it in sync with the source of truth so the .pyd and
    # the lib agree on what HyperDBCluster looks like.
    - name: Sync HyperDB.h into Python Tree
      shell: bash
      run: |
        cp "${{ github.workspace }}/HyperDB/HyperDB.h" "${{ github.workspace }}/HyperDB-Python/HyperDB-Python/include/HyperDB.h"
        cp "${{ github.workspace }}/HyperDB/include/hyperdb_generated.h" "${{ github.workspace }}/HyperDB-Python/HyperDB-Python/include/hyperdb_generated.h" 2>/dev/null || true
        rm -rf "${{ github.workspace }}/HyperDB-Python/HyperDB-Python/include/flatbuffers"
        cp -R "${{ github.workspace }}/HyperDB/include/flatbuffers" "${{ github.workspace }}/HyperDB-Python/HyperDB-Python/include/flatbuffers" 2>/dev/null || true

    - name: Build Python Module
      shell: bash
      run: |
        cmake -B build-pymod \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_BUILD_TYPE=Release \
          -S "${{ github.workspace }}/HyperDB-Python"
        cmake --build build-pymod --config Release --parallel

    - name: Package Artifacts
      shell: bash
      run: |
        mkdir -p "artifacts/${{ matrix.platform }}"
        
        # Copy base library
        find "${{ github.workspace }}/build-base" -name "${{ matrix.lib_name }}" -exec cp {} "artifacts/${{ matrix.platform }}/" \;
        
        # Headers: one include root — add this folder to your compile (-I) and
        # HyperDB.h's flatbuffers / schema includes resolve correctly.
        cp "${{ github.workspace }}/HyperDB/HyperDB.h" "artifacts/${{ matrix.platform }}/"
        cp "${{ github.workspace }}/HyperDB/include/hyperdb_generated.h" "artifacts/${{ matrix.platform }}/"
        mkdir -p "artifacts/${{ matrix.platform }}/flatbuffers"
        cp -R "${{ github.workspace }}/HyperDB/include/flatbuffers/." "artifacts/${{ matrix.platform }}/flatbuffers/"
        
        # Copy test executable
        find "${{ github.workspace }}/build-test" -name "${{ matrix.test_exe }}" -exec cp {} "artifacts/${{ matrix.platform }}/" \;
        chmod +x "artifacts/${{ matrix.platform }}/${{ matrix.test_exe }}" 2>/dev/null || true
        
        # Copy Python module
        find "${{ github.workspace }}/build-pymod" -name "${{ matrix.python_lib_name }}" -exec cp {} "artifacts/${{ matrix.platform }}/" \;
        
        # Copy bindings source
        cp "${{ github.workspace }}/HyperDB-Python/HyperDB-Python/main.cpp" "artifacts/${{ matrix.platform }}/bindings.cpp"

        # Copy python utility scripts so a user can extract the zip and
        # immediately run stress_test.py / browser.py / cli.py without needing
        # to git-clone the repo. these are platform-agnostic; we ship the same
        # copy in every platform's zip because life is too short.
        cp "${{ github.workspace }}/HyperDB-Python/stress_test.py" "artifacts/${{ matrix.platform }}/stress_test.py"
        cp "${{ github.workspace }}/HyperDB-Python/browser.py" "artifacts/${{ matrix.platform }}/browser.py"
        cp "${{ github.workspace }}/HyperDB-Python/cli.py" "artifacts/${{ matrix.platform }}/cli.py"

        echo "=== Artifacts ==="
        ls -la "artifacts/${{ matrix.platform }}/"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hyperdb-${{ matrix.platform }}
        path: artifacts/${{ matrix.platform }}/
        retention-days: 7

  # Separate Linux build inside a manylinux_2_28 container (GLIBC 2.28, GCC 14).
  # The standard ubuntu-latest runner produces a .so that requires GLIBC 2.38+,
  # which breaks on hosts pinned to older Ubuntu LTS (e.g. PythonAnywhere on
  # 22.04 / GLIBC 2.35). Building against GLIBC 2.28 works everywhere from
  # RHEL 8 / Ubuntu 20.04 onward. Python 3.11 picked to match the Windows build.
  build-linux-manylinux:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Configure Toolchain
      shell: bash
      run: |
        # We avoid the /opt/python/cpXXX installs that ship with the manylinux
        # image because they're static-linked and have no libpython.so on
        # disk — CMake's find_package(Python3 ... Development) needs both
        # Development.Module AND Development.Embed, and the test exe genuinely
        # links libpython (libHyperDB.a has pybind11 baked in). AlmaLinux 8
        # ships python3.11 in AppStream with a proper libpython3.11.so.
        dnf install -y python3.11 python3.11-devel
        python3.11 -m pip install --upgrade pip
        python3.11 -m pip install cmake ninja pybind11
        echo "PYBIN=/usr/bin/python3.11" >> "$GITHUB_ENV"
        which cmake && cmake --version
        gcc --version
        python3.11 --version
        ls /usr/lib64/libpython3.11* || true

    - name: Build Base Library
      shell: bash
      run: |
        cmake -B build-base \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DPython3_EXECUTABLE="$PYBIN" \
          -S "$GITHUB_WORKSPACE"
        cmake --build build-base --config Release --target HyperDB --parallel

    - name: Copy Library to Test Dir
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/HyperDB-Test/include/lib"
        find "$GITHUB_WORKSPACE/build-base" -name "libHyperDB.a" -exec cp {} "$GITHUB_WORKSPACE/HyperDB-Test/include/lib/" \;
        ls -la "$GITHUB_WORKSPACE/HyperDB-Test/include/lib/"

    - name: Sync HyperDB.h into Test Tree
      shell: bash
      run: |
        cp "$GITHUB_WORKSPACE/HyperDB/HyperDB.h" "$GITHUB_WORKSPACE/HyperDB-Test/HyperDB-Test/include/HyperDB.h"
        cp "$GITHUB_WORKSPACE/HyperDB/include/hyperdb_generated.h" "$GITHUB_WORKSPACE/HyperDB-Test/HyperDB-Test/include/hyperdb_generated.h" 2>/dev/null || true
        rm -rf "$GITHUB_WORKSPACE/HyperDB-Test/HyperDB-Test/include/flatbuffers"
        cp -R "$GITHUB_WORKSPACE/HyperDB/include/flatbuffers" "$GITHUB_WORKSPACE/HyperDB-Test/HyperDB-Test/include/flatbuffers" 2>/dev/null || true

    - name: Build Test Executable
      shell: bash
      run: |
        cmake -B build-test \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_BUILD_TYPE=Release \
          -DPython3_EXECUTABLE="$PYBIN" \
          -S "$GITHUB_WORKSPACE/HyperDB-Test"
        cmake --build build-test --config Release --parallel

    - name: Build Python Library
      shell: bash
      run: |
        cmake -B build-pylib \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DBUILD_PYTHON_MODULE=ON \
          -DPython3_EXECUTABLE="$PYBIN" \
          -S "$GITHUB_WORKSPACE"
        cmake --build build-pylib --config Release --target HyperDB --parallel

    - name: Copy Library to Python Dir
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/HyperDB-Python/include/lib"
        find "$GITHUB_WORKSPACE/build-pylib" -name "libHyperDB.a" -exec cp {} "$GITHUB_WORKSPACE/HyperDB-Python/include/lib/" \;
        ls -la "$GITHUB_WORKSPACE/HyperDB-Python/include/lib/"

    - name: Sync HyperDB.h into Python Tree
      shell: bash
      run: |
        cp "$GITHUB_WORKSPACE/HyperDB/HyperDB.h" "$GITHUB_WORKSPACE/HyperDB-Python/HyperDB-Python/include/HyperDB.h"
        cp "$GITHUB_WORKSPACE/HyperDB/include/hyperdb_generated.h" "$GITHUB_WORKSPACE/HyperDB-Python/HyperDB-Python/include/hyperdb_generated.h" 2>/dev/null || true
        rm -rf "$GITHUB_WORKSPACE/HyperDB-Python/HyperDB-Python/include/flatbuffers"
        cp -R "$GITHUB_WORKSPACE/HyperDB/include/flatbuffers" "$GITHUB_WORKSPACE/HyperDB-Python/HyperDB-Python/include/flatbuffers" 2>/dev/null || true

    - name: Build Python Module
      shell: bash
      run: |
        cmake -B build-pymod \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_BUILD_TYPE=Release \
          -DPython3_EXECUTABLE="$PYBIN" \
          -S "$GITHUB_WORKSPACE/HyperDB-Python"
        cmake --build build-pymod --config Release --parallel

    - name: Verify GLIBC requirement
      shell: bash
      run: |
        SO=$(find "$GITHUB_WORKSPACE/build-pymod" -name "HyperDB.so" | head -n1)
        echo "Inspecting: $SO"
        # Highest GLIBC version referenced by the .so. If this prints anything
        # > 2.28 the build leaked into a newer libc symbol and won't run on
        # PythonAnywhere — fail loudly so we catch it in CI instead of prod.
        MAX=$(objdump -T "$SO" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -n1 || echo "GLIBC_none")
        echo "Highest GLIBC symbol: $MAX"
        if [ "$MAX" != "GLIBC_none" ]; then
          ver=${MAX#GLIBC_}
          awk -v v="$ver" 'BEGIN { split(v,a,"."); if (a[1]>2 || (a[1]==2 && a[2]>28)) exit 1 }' \
            || { echo "ERROR: .so requires $MAX, exceeds GLIBC_2.28 ceiling"; exit 1; }
        fi

    - name: Package Artifacts
      shell: bash
      run: |
        OUT="artifacts/linux-gcc-manylinux_2_28"
        mkdir -p "$OUT"

        # Base library
        find "$GITHUB_WORKSPACE/build-base" -name "libHyperDB.a" -exec cp {} "$OUT/" \;

        # Headers
        cp "$GITHUB_WORKSPACE/HyperDB/HyperDB.h" "$OUT/"
        cp "$GITHUB_WORKSPACE/HyperDB/include/hyperdb_generated.h" "$OUT/"
        mkdir -p "$OUT/flatbuffers"
        cp -R "$GITHUB_WORKSPACE/HyperDB/include/flatbuffers/." "$OUT/flatbuffers/"

        # Test executable
        find "$GITHUB_WORKSPACE/build-test" -name "HyperDB-Test" -exec cp {} "$OUT/" \;
        chmod +x "$OUT/HyperDB-Test" 2>/dev/null || true

        # Python module
        find "$GITHUB_WORKSPACE/build-pymod" -name "HyperDB.so" -exec cp {} "$OUT/" \;

        # Bindings source
        cp "$GITHUB_WORKSPACE/HyperDB-Python/HyperDB-Python/main.cpp" "$OUT/bindings.cpp"

        # Utility scripts
        cp "$GITHUB_WORKSPACE/HyperDB-Python/stress_test.py" "$OUT/stress_test.py"
        cp "$GITHUB_WORKSPACE/HyperDB-Python/browser.py" "$OUT/browser.py"
        cp "$GITHUB_WORKSPACE/HyperDB-Python/cli.py" "$OUT/cli.py"

        echo "=== Artifacts ==="
        ls -la "$OUT/"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hyperdb-linux-gcc-manylinux_2_28
        path: artifacts/linux-gcc-manylinux_2_28/
        retention-days: 7

  release:
    needs: [build, build-linux-manylinux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: hyperdb-*

    - name: Create Archives
      run: |
        cd artifacts
        for dir in hyperdb-*/; do
          platform=$(basename "$dir" | sed 's/hyperdb-//')
          cd "$dir"
          zip -r "../hyperdb-${platform}-${{ github.ref_name }}.zip" *
          cd ..
        done

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*.zip
        name: ${{ github.ref_name }}
        body: |
          HyperDB ${{ github.ref_name }}
          
          ## Included Binaries
          
          ### Windows (MSVC)
          - `HyperDB.lib` - Static library for C++
          - `HyperDB.pyd` - Python module
          - `HyperDB-Test.exe` - Test executable
          - `bindings.cpp` - Python bindings source

          ### Linux (GCC & Clang)
          - `libHyperDB.a` - Static library for C++
          - `HyperDB.so` - Python module
          - `HyperDB-Test` - Test executable
          - `bindings.cpp` - Python bindings source

          ### Linux (manylinux_2_28, GLIBC 2.28, Python 3.11)
          Drop-in replacement for the standard Linux build when your host runs
          an older glibc. Tested target: PythonAnywhere (Ubuntu 22.04, GLIBC
          2.35). Use this zip if `import HyperDB` fails with
          `version 'GLIBC_2.XX' not found`.
          - `libHyperDB.a` - Static library for C++
          - `HyperDB.so` - Python module (built against Python 3.11)
          - `HyperDB-Test` - Test executable
          - `bindings.cpp` - Python bindings source

          ### Python utility scripts (all platforms)
          Drop these next to the built `HyperDB.pyd` / `HyperDB.so` and run them.
          - `stress_test.py` - solo + cluster benchmark / smoke test (`python stress_test.py`)
          - `browser.py` - Qt GUI database browser (`python browser.py`, requires PySide6: `pip install PySide6`)
          - `cli.py` - terminal/ncurses database browser (`python cli.py`, Windows users: `pip install windows-curses`)
          
          ### C++ headers (all platforms)
          Add the zip root to your include path (e.g. `-I/path/to/extract`). The archive contains:
          - `HyperDB.h`
          - `hyperdb_generated.h` (FlatBuffers types used by the API)
          - `flatbuffers/` (header-only FlatBuffers runtime required by `HyperDB.h`)
          
          ## Build Info
          - CMake Release configuration
          - C++20 standard
          - Python 3.11+ compatible
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}